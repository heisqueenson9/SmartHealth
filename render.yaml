# ── Render.com Deployment Configuration ─────────────────────
# Smart Health Sync v2.0
# Authors: Enock Queenson Eduafo & Christabel Araba Edumadze | University of Ghana 2026

databases:
  - name: smart-health-sync-db
    databaseName: smarthealth_db
    user: smarthealth_user
    plan: free

services:
  - type: web
    name: smart-health-sync
    env: python
    pythonVersion: "3.11.9"
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --preload --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: smart-health-sync-db
          property: connectionString
      # Set your deployed URL here (e.g. https://smart-health-sync.onrender.com)
      - key: SITE_URL
        value: https://smarthealth-na6j.onrender.com
    healthCheckPath: /api/health
