name: Keep Render App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with retries for Render cold starts)
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf --max-time 30 https://smarthealthsync.onrender.com/api/health; then
              echo "Ping succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 20s before retry..."
            sleep 20
          done
          echo "All 5 attempts failed — app appears genuinely down."
          exit 1
