{% extends "base.html" %}

{% block body_class %}{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="auth-card" style="max-width:420px; margin:60px auto;">
    <h2 class="auth-title">Administrator Access</h2>
    <p class="auth-field-hint mb-3">This area is restricted to system administrators.</p>
    <form id="adminLoginForm">
      <div class="auth-form-group">
        <label class="auth-label">Email</label>
        <input type="email" id="adminEmail" class="auth-input" required>
      </div>
      <div class="auth-form-group">
        <label class="auth-label">Password</label>
        <input type="password" id="adminPassword" class="auth-input" required>
      </div>
      <button type="submit" class="auth-btn mt-3">Sign In</button>
      <div id="adminLoginError" class="text-danger mt-2" style="display:none;"></div>
    </form>
  </div>
</div>

<script>
document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("adminLoginError");
    errEl.style.display = "none";
    try {
        const res = await fetch("/api/auth/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("adminEmail").value,
                password: document.getElementById("adminPassword").value
            })
        });
        const data = await res.json();
        if (!res.ok || data.status !== "success") {
            throw new Error(data.error || "Access denied.");
        }
        window.location.href = "/portal";
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
    }
});
</script>
{% endblock %}
